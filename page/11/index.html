<script>
    const first = [
        "Ode",
        "Homage",
        "Tribute"
    ]
    const second = [
        "a friend",
        "a madman",
        "the misunderstood",
        "the enlightened"
    ]
    function getRandom(array) {
        return array[Math.floor(Math.random()*array.length)]
    }
    setInterval(function() {
        document.getElementById("title").innerHTML = `"${getRandom(first)} to ${getRandom(second)}"`
    }, 1000)
</script>

<div class="viewportSize">
    <h1 id="title">"Ode to a friend"</h1>
</div>
